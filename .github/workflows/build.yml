name: Build and package DISABLED_FUNCTIONS plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: lefred/mariadb-plugin-ci/.github/workflows/build-plugin.yml@v1
    with:
      plugin_name: disabled-functions
      plugin_directory: disabled_functions
      build_target: disabled_functions
      plugin_library: disabled_functions.so

      mariadb_versions: |
          13.0.2
          13.1.1
          
      cmake_options: -DPLUGIN_DISABLED_FUNCTIONS=DYNAMIC
      test_suite: disabled_functions
      run_tests: false

